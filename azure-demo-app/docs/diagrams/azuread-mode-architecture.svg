<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 440" font-family="sans-serif" role="img">
<title>AUTH_MODE=azuread architecture</title>
<desc>Browser is redirected by Azure Container Apps' built-in authentication to Microsoft Entra ID to sign in. Container Apps validates the resulting token using a client secret from Key Vault, then forwards the request to the FastAPI app with the caller's identity and role attached in a header. The FastAPI app only reads that header before allowing access to Cosmos DB and Storage.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="440" fill="#ffffff"/>

<rect x="240" y="30" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="56" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Browser / curl</text>

<line x1="300" y1="74" x2="260" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="150" y="110" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="260" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Container Apps auth</text>
<text x="260" y="150" text-anchor="middle" font-size="12" fill="#185FA5">Validates &amp; forwards identity</text>

<line x1="370" y1="138" x2="420" y2="138" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="395" y="126" text-anchor="middle" font-size="12" fill="#5F5E5A">sign-in</text>

<rect x="420" y="110" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="510" y="132" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Microsoft Entra ID</text>
<text x="510" y="150" text-anchor="middle" font-size="12" fill="#534AB7">Issues token with app role</text>

<path d="M260,166 L260,190 L240,190 L240,240" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="150" y="209" text-anchor="middle" font-size="12" fill="#5F5E5A">reads client secret</text>

<rect x="150" y="240" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="240" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Key Vault</text>
<text x="240" y="280" text-anchor="middle" font-size="12" fill="#534AB7">Client secret only</text>

<path d="M300,166 L300,210 L490,210 L490,240" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="500" y="204" text-anchor="middle" font-size="12" fill="#5F5E5A">principal header</text>

<rect x="380" y="240" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="490" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">FastAPI app</text>
<text x="490" y="280" text-anchor="middle" font-size="12" fill="#0F6E56">Reads principal header only</text>

<line x1="490" y1="296" x2="400" y2="360" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="230" y="362" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="375" y="384" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Cosmos DB &amp; file share</text>
<text x="375" y="402" text-anchor="middle" font-size="12" fill="#0F6E56">reader/writer/admin enforced here</text>
</svg>
