<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" font-family="sans-serif" role="img">
<title>AUTH_MODE=jwt architecture</title>
<desc>Browser sends credentials to the FastAPI app, which validates them against a hashed user list and JWT signing key stored in Key Vault, issues a JWT, and then validates that JWT on every subsequent request before allowing access to Cosmos DB and Storage.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="380" fill="#ffffff"/>

<rect x="220" y="40" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Browser / curl</text>

<line x1="270" y1="84" x2="270" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="116" text-anchor="middle" font-size="12" fill="#5F5E5A">credentials</text>
<line x1="370" y1="140" x2="370" y2="84" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="470" y="116" text-anchor="middle" font-size="12" fill="#5F5E5A">JWT cookie</text>

<rect x="150" y="140" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="250" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">FastAPI app</text>
<text x="250" y="180" text-anchor="middle" font-size="12" fill="#0F6E56">Validates login, issues JWT</text>

<line x1="350" y1="169" x2="430" y2="169" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="390" y="157" text-anchor="middle" font-size="12" fill="#5F5E5A">reads</text>

<rect x="430" y="140" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="535" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Key Vault</text>
<text x="535" y="180" text-anchor="middle" font-size="12" fill="#534AB7">JWT secret + hashed users</text>

<line x1="250" y1="196" x2="250" y2="262" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="150" y="232" text-anchor="middle" font-size="12" fill="#5F5E5A">verified requests</text>

<rect x="150" y="262" width="290" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="295" y="284" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">Cosmos DB &amp; file share</text>
<text x="295" y="302" text-anchor="middle" font-size="12" fill="#0F6E56">reader/writer/admin enforced here</text>
</svg>
