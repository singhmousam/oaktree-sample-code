<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" font-family="sans-serif" role="img">
<title>Future-state production architecture</title>
<desc>An enterprise landing zone with VNet-integrated private networking. The primary request flow goes from the user through an edge layer (Front Door, WAF, API Management) into a private app runtime (Container Apps), then to data services reached only via private endpoints (Storage, Cosmos DB, Key Vault). Alongside that flow, three cross-cutting capabilities support the whole platform: identity and governance (Entra ID with Conditional Access and Privileged Identity Management), observability (Log Analytics, Sentinel, Defender for Cloud), and a CI/CD pipeline for automated build, scan, and deploy.</desc>
