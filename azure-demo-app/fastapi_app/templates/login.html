<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign in</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; height: 100vh;
           display: flex; align-items: center; justify-content: center; background: #f7f7f9; }
    .card { background: #fff; padding: 2rem 2.5rem; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12); width: 320px; }
    h1 { margin-top: 0; font-size: 1.3rem; }
    label { display: block; margin-top: 1rem; font-size: 0.85rem; color: #444; }
    input { width: 100%; padding: 0.5rem; margin-top: 0.25rem; border: 1px solid #ccc;
            border-radius: 6px; box-sizing: border-box; font-size: 0.95rem; }
    button { width: 100%; margin-top: 1.5rem; background: #2b2b3a; color: #fff; border: none;
             padding: 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    button:hover { background: #40405a; }
    .error { margin-top: 1rem; background: #fdecec; color: #a12222; padding: 0.6rem 0.8rem;
              border-radius: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <form class="card" action="/auth/login" method="post">
    <h1>Sign in</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <label>Username
      <input type="text" name="username" required autofocus />
    </label>
    <label>Password
      <input type="password" name="password" required />
    </label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
