name: python-build-ci

on:
  push:
    branches: [ "main", "deploy" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: CI Pipeline
        uses: actions/checkout@v4


    - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: oakcrdev.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          # docker login oakcrdev.azurecr.io -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker image
        run: |
          # Set the build tag using timestamp
          IMAGE_TAG="oakcrdev.azurecr.io/dotnet-app:$(date +%s)"
          
          # Build passing the app folder as context to prevent directory errors
          docker build Day4/dotnet/Api --file Day4/dotnet/Api/Dockerfile --tag $IMAGE_TAG
          
          # Push the image to Azure Container Registry
          docker push $IMAGE_TAG
